# The production shape on the platform-infra cluster (ADR 0021): the shared CloudNativePG server, every secret from an
# Infisical-managed Secret, Traefik behind Cloudflare (TLS ends at Cloudflare), Reloader rolling on secret changes.
# All of Tò He on toheplay.io.vn, a domain it has to itself (ADR 0040): the hub at its root (public pages and the app), the
# games origin, the docs and the console one level down — Cloudflare's free certificate covers one level (ADR 0042).
publicUrls:
  hub: https://toheplay.io.vn
  games: https://games.toheplay.io.vn
  docs: https://docs.toheplay.io.vn
  # The operators' console, behind Cloudflare Access (ADR 0042).
  console: https://console.toheplay.io.vn
global:
  image:
    tag: sha-0000000000000000000000000000000000000000
defaults:
  annotations:
    reloader.stakater.com/auto: "true"
hub:
  proxy:
    trustedProxies: [10.42.0.0/16]
    clientIpHeaders: [CF-Connecting-IP]
  # People write to security@ at the root (ADR 0042).
  securityContact: security@toheplay.io.vn
infra:
  postgres:
    mode: external
    maxPoolSize: 8
    external:
      host: postgres-rw.platform-data.svc.cluster.local
secrets:
  existingSecret: tohe-secrets
ingress:
  className: traefik
networkPolicy:
  enabled: true
  ingressNamespaceLabels:
    kubernetes.io/metadata.name: kube-system
# kube-prometheus-stack scrapes any ServiceMonitor in the cluster (ADR 0036).
metrics:
  serviceMonitor:
    enabled: true
  prometheusRule:
    enabled: true
  scraperNamespaceLabels:
    kubernetes.io/metadata.name: monitoring
