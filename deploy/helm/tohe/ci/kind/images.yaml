# CI's kind cluster, on top of ci/standalone.yaml: the run's images, built once by the images job and loaded with
# `kind load docker-image`, never pulled. Their names are the release's (values.yaml), so the chart is tested with the
# very images main publishes; CI sets their tag with --set global.image.tag=sha-<commit>.
global:
  image:
    pullPolicy: Never
