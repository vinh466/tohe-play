{{- /*
The games origin: immutable game builds and catalog.json, embedded only by the hub (ADR 0002, 0007) — and by the
console, to watch a ranked run in the game itself (ADR 0032, 0042).
*/ -}}
{{- $embedders := include "tohe.origin" .Values.publicUrls.hub }}
{{- with .Values.publicUrls.console }}
{{- $embedders = printf "%s %s" $embedders (include "tohe.origin" .) }}
{{- end }}
{{- $env := list
  (dict "name" "HUB_ORIGINS" "value" $embedders)
  (dict "name" "PUBLIC_HUB_URL" "value" (trimSuffix "/" .Values.publicUrls.hub)) -}}
{{ include "tohe.caddyWorkload" (dict "root" . "component" "games" "values" .Values.games "env" $env "probePath" "/catalog.json") }}
