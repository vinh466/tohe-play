{{- if .Values.ingress.enabled }}
{{- /*
One Ingress, one host per origin: the hub (which also serves /api), the games origin, the site, and the console — the
hub's pods on their console port (ADR 0042).
*/ -}}
{{- $routes := list
  (dict "host" (include "tohe.host" .Values.publicUrls.hub) "component" "hub" "port" "http")
  (dict "host" (include "tohe.host" .Values.publicUrls.games) "component" "games" "port" "http") -}}
{{- if .Values.site.enabled }}
{{- $routes = append $routes (dict "host" (include "tohe.host" .Values.publicUrls.site) "component" "site" "port" "http") }}
{{- end }}
{{- with .Values.publicUrls.console }}
{{- $routes = append $routes (dict "host" (include "tohe.host" .) "component" "hub" "port" "console") }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "tohe.fullname" . }}
  labels:
    {{- include "tohe.labels" (dict "root" . "component" "ingress") | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range $routes }}
    - host: {{ .host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "tohe.componentName" (dict "root" $ "component" .component) }}
                port:
                  name: {{ .port }}
    {{- end }}
{{- end }}
