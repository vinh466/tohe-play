{{- /* The hub: the PWA, and /api proxied to the API on the same origin (deploy/docker/Caddyfile.hub). */ -}}
{{- $env := list
  (dict "name" "API_UPSTREAM" "value" (printf "%s:8080" (include "tohe.componentName" (dict "root" . "component" "api"))))
  (dict "name" "GAMES_ORIGIN" "value" (include "tohe.origin" .Values.publicUrls.games)) -}}
{{- with .Values.hub.proxy.trustedProxies }}
{{- $env = append $env (dict "name" "TOHE_TRUSTED_PROXIES" "value" (join " " .)) }}
{{- end }}
{{- with .Values.hub.proxy.clientIpHeaders }}
{{- $env = append $env (dict "name" "TOHE_CLIENT_IP_HEADERS" "value" (join " " .)) }}
{{- end }}
{{ include "tohe.caddyWorkload" (dict "root" . "component" "hub" "values" .Values.hub "env" $env "probePath" "/") }}
