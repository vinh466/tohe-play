{{- if not .Values.secrets.existingSecret }}
# Rendered from secrets.values because no secrets.existingSecret was named. Nothing here is generated: the same
# values render the same Secret, under `helm install` and under GitOps alike.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tohe.secretName" . }}
  labels:
    {{- include "tohe.labels" (dict "root" . "component" "secrets") | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.infra.postgres.passwordKey }}: {{ .Values.secrets.values.postgresPassword | quote }}
  {{- with .Values.secrets.values.telemetryOperatorToken }}
  telemetry-operator-token: {{ . | quote }}
  {{- end }}
{{- end }}
