{{- /*
`helm test`: the hub serves the app, proxies a healthy API, and the games origin serves its catalog; the console's site
serves its page, never indexed, and refuses the console's routes without its session (ADR 0042).
*/ -}}
{{- $hub := include "tohe.componentName" (dict "root" . "component" "hub") }}
{{- $games := include "tohe.componentName" (dict "root" . "component" "games") }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "tohe.componentName" (dict "root" . "component" "smoke-test") }}
  labels:
    {{- include "tohe.labels" (dict "root" . "component" "smoke-test") | nindent 4 }}
  annotations:
    helm.sh/hook: test
    # Kept after it runs so `helm test --logs` and `kubectl logs` can read it; the next `helm test` replaces it.
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 100
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: smoke
      image: {{ .Values.tests.image }}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      command:
        - sh
        - -c
        - |
          set -e
          # The API's host filtering wants the public host, as the ingress would send it.
          curl -fsS -H "Host: {{ include "tohe.host" .Values.publicUrls.hub }}" http://{{ $hub }}:8080/api/health
          echo
          curl -fsS http://{{ $hub }}:8080/play | grep -q '<div id="root">'
          curl -fsS http://{{ $games }}:8080/catalog.json | grep -q '"games"'
          {{- with .Values.publicUrls.console }}
          curl -fsSI http://{{ $hub }}:8081/ | grep -qi '^x-robots-tag: noindex'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Host: {{ include "tohe.host" . }}" http://{{ $hub }}:8081/api/admin/overview)" = 401
          {{- end }}
          echo smoke test passed
