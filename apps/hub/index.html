<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f97316" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Tò He</title>
    <meta
      name="description"
      content="Game nhỏ, mở ra là chơi: không quảng cáo, không cần tài khoản. Giữ tiến độ khi bạn muốn, rủ bạn vào cùng bàn bằng một link."
    />
    <!-- Link previews (Zalo, Messenger…) read these from the HTML, without running the app. og:url and og:image must be
         absolute and so need the hub's public URL at run time (one image serves every environment, ADR 0021): the image's
         build turns the placeholder host and path below into Caddy template actions (web.Dockerfile), which the hub's
         Caddy fills in from TOHE_HUB_URL and the path asked for. The picture is the public pages' (apps/web/public). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tò He" />
    <meta property="og:locale" content="vi_VN" />
    <meta property="og:url" content="https://tohe-hub.invalid/__request_path__" />
    <meta property="og:image" content="https://tohe-hub.invalid/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Tò He — game nhỏ, mở ra là chơi" />
    <meta property="og:title" content="Tò He" />
    <meta
      property="og:description"
      content="Game nhỏ, mở ra là chơi: không quảng cáo, không cần tài khoản. Giữ tiến độ khi bạn muốn, rủ bạn vào cùng bàn bằng một link."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tò He" />
    <meta
      name="twitter:description"
      content="Game nhỏ, mở ra là chơi: không quảng cáo, không cần tài khoản. Giữ tiến độ khi bạn muốn, rủ bạn vào cùng bàn bằng một link."
    />
    <meta name="twitter:image" content="https://tohe-hub.invalid/og.png" />
    <!-- Light/dark before the first paint (blocking on purpose; see src/theme/theme.ts). -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
