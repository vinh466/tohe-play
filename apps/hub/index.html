<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f97316" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Tò He</title>
    <meta
      name="description"
      content="Game nhỏ, mở ra là chơi: không quảng cáo, không cần tài khoản. Giữ tiến độ khi bạn muốn, rủ bạn vào cùng bàn bằng một link."
    />
    <!-- Link previews (Zalo, Messenger…) read these from the HTML, without running the app. og:url and og:image must be
         absolute and so need the hub's public URL at run time (one image serves every environment, ADR 0021): the image's
         build turns the placeholder host and path below into Caddy template actions (web.Dockerfile), which the hub's
         Caddy fills in from TOHE_HUB_URL and the path asked for. The picture is the public pages' (apps/web/public). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tò He" />
    <meta property="og:locale" content="vi_VN" />
    <meta property="og:url" content="https://tohe-hub.invalid/__request_path__" />
    <meta property="og:image" content="https://tohe-hub.invalid/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Tò He — game nhỏ, mở ra là chơi" />
    <meta property="og:title" content="Tò He" />
    <meta
      property="og:description"
      content="Game nhỏ, mở ra là chơi: không quảng cáo, không cần tài khoản. Giữ tiến độ khi bạn muốn, rủ bạn vào cùng bàn bằng một link."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tò He" />
    <meta
      name="twitter:description"
      content="Game nhỏ, mở ra là chơi: không quảng cáo, không cần tài khoản. Giữ tiến độ khi bạn muốn, rủ bạn vào cùng bàn bằng một link."
    />
    <meta name="twitter:image" content="https://tohe-hub.invalid/og.png" />
    <!-- Light/dark before the first paint (blocking on purpose; see src/theme/theme.ts). -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <!-- The first paint, before any script runs: the frame's navigation and a grid of tile placeholders, drawn with the
         design tokens (the colours theme-init.js set on <html>) and the same Tailwind classes as the frame and the
         catalog, so it is the shape of what comes. React replaces everything inside #root when it mounts. A picture
         only: hidden from screen readers, nothing to focus (src/coldStart.test.ts). -->
    <div id="root">
      <div
        aria-hidden="true"
        data-skeleton="frame"
        class="flex h-dvh flex-col overflow-hidden pb-[calc(4rem+env(safe-area-inset-bottom))] md:pb-0 md:pl-[calc(7rem+env(safe-area-inset-left))] short:pb-0 short:pl-[calc(7rem+env(safe-area-inset-left))]"
      >
        <nav
          class="fixed inset-y-0 left-0 z-30 hidden w-[calc(7rem+env(safe-area-inset-left))] flex-col gap-2 border-line border-r bg-surface pt-[max(1.5rem,env(safe-area-inset-top))] pl-[env(safe-area-inset-left)] md:flex short:flex short:gap-1 short:pt-[max(0.5rem,env(safe-area-inset-top))]"
        >
          <div class="mx-2 h-20 rounded-2xl bg-soft short:h-14"></div>
          <div class="mx-2 h-20 rounded-2xl bg-fill short:h-14"></div>
          <div class="mx-2 h-20 rounded-2xl bg-fill short:h-14"></div>
        </nav>
        <div
          class="mx-auto flex w-full max-w-[75rem] flex-col gap-6 px-4 pt-[max(1.5rem,env(safe-area-inset-top))] md:px-8 short:gap-3 short:pt-[max(0.75rem,env(safe-area-inset-top))]"
        >
          <div class="flex items-center justify-between gap-3">
            <div class="h-9 w-44 animate-pulse rounded-full bg-soft motion-reduce:animate-none short:h-7"></div>
            <div class="h-11 w-36 animate-pulse rounded-full bg-surface shadow-sm motion-reduce:animate-none"></div>
          </div>
          <div class="grid grid-cols-2 gap-4 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 short:gap-2">
            <div data-skeleton="tile" class="h-44 animate-pulse rounded-3xl bg-soft motion-reduce:animate-none short:h-28"></div>
            <div data-skeleton="tile" class="h-44 animate-pulse rounded-3xl bg-soft motion-reduce:animate-none short:h-28"></div>
            <div data-skeleton="tile" class="h-44 animate-pulse rounded-3xl bg-soft motion-reduce:animate-none short:h-28"></div>
            <div data-skeleton="tile" class="h-44 animate-pulse rounded-3xl bg-soft motion-reduce:animate-none short:h-28"></div>
            <div data-skeleton="tile" class="h-44 animate-pulse rounded-3xl bg-soft motion-reduce:animate-none short:h-28"></div>
            <div data-skeleton="tile" class="h-44 animate-pulse rounded-3xl bg-soft motion-reduce:animate-none short:h-28"></div>
            <div data-skeleton="tile" class="h-44 animate-pulse rounded-3xl bg-soft motion-reduce:animate-none short:h-28"></div>
            <div data-skeleton="tile" class="h-44 animate-pulse rounded-3xl bg-soft motion-reduce:animate-none short:h-28"></div>
          </div>
        </div>
        <nav
          class="fixed inset-x-0 bottom-0 z-30 grid grid-cols-3 border-line border-t bg-surface px-[env(safe-area-inset-left)] pb-[env(safe-area-inset-bottom)] md:hidden short:hidden"
        >
          <div class="flex h-16 flex-col items-center justify-center gap-1.5">
            <span class="size-6 rounded-full bg-soft"></span><span class="h-2 w-10 rounded-full bg-soft"></span>
          </div>
          <div class="flex h-16 flex-col items-center justify-center gap-1.5">
            <span class="size-6 rounded-full bg-fill"></span><span class="h-2 w-10 rounded-full bg-fill"></span>
          </div>
          <div class="flex h-16 flex-col items-center justify-center gap-1.5">
            <span class="size-6 rounded-full bg-fill"></span><span class="h-2 w-10 rounded-full bg-fill"></span>
          </div>
        </nav>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
