<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f97316" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Tò He</title>
    <meta
      name="description"
      content="Game nhỏ, mở ra là chơi: không quảng cáo, không cần tài khoản. Giữ tiến độ khi bạn muốn, rủ bạn vào cùng bàn bằng một link."
    />
    <!-- Link previews (Zalo, Messenger…) read these from the HTML, without running the app. og:url and og:image must be
         absolute and so need the hub's public URL at run time: added with the Caddy template, not here (E-03). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tò He" />
    <meta property="og:locale" content="vi_VN" />
    <meta property="og:title" content="Tò He" />
    <meta
      property="og:description"
      content="Game nhỏ, mở ra là chơi: không quảng cáo, không cần tài khoản. Giữ tiến độ khi bạn muốn, rủ bạn vào cùng bàn bằng một link."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Tò He" />
    <meta
      name="twitter:description"
      content="Game nhỏ, mở ra là chơi: không quảng cáo, không cần tài khoản. Giữ tiến độ khi bạn muốn, rủ bạn vào cùng bàn bằng một link."
    />
    <!-- Light/dark before the first paint (blocking on purpose; see src/theme/theme.ts). -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
