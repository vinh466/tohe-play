name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  ASTRO_TELEMETRY_DISABLED: 1

# A pull request runs what it touches (docs/guides/environments.md#continuous-integration): nothing for notes only, the
# site and its link check for docs, every job otherwise. A push to main runs every job, every task without reading a
# cache, before anything is published. The jobs run side by side; none waits for another but publish.
jobs:
  changes:
    name: What the change touches
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          scope="$(scripts/ci-scope.sh)"
          echo "$scope" >> "$GITHUB_OUTPUT"
          echo "$scope"

  verify:
    name: Verify (lint, typecheck, test, build, conformance)
    needs: changes
    if: needs.changes.outputs.scope != 'notes'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ALL: ${{ needs.changes.outputs.scope == 'all' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-dotnet@v6
        if: env.ALL == 'true'
        with:
          global-json-file: global.json
      - run: pnpm install --frozen-lockfile
      - run: dotnet tool restore
        if: env.ALL == 'true'
      # Turborepo's cache from earlier runs: a task whose inputs did not change replays its result. A pull request reads
      # the newest one its base branch saved; main never reads it (--cache=local:w below), it only saves a fresh one.
      - name: Turborepo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - name: Install Chromium for the conformance kit
        if: env.ALL == 'true'
        run: pnpm --filter @tohe/conformance exec playwright install --with-deps chromium
      - name: Docs only — Biome, and the site with its link check
        if: env.ALL != 'true'
        run: pnpm exec biome check . && pnpm exec turbo run build --filter=@tohe/site
      - name: pnpm verify
        if: env.ALL == 'true'
        run: pnpm verify ${{ github.event_name == 'push' && '--cache=local:w' || '' }}
      - name: Generated files are up to date
        if: env.ALL == 'true'
        # The API's types, and what the map in @tohe/routes generates (ADR 0042), regenerated outside Turborepo's cache.
        run: |
          pnpm --filter @tohe/hub generate:api
          pnpm --filter @tohe/routes build
          git status --porcelain
          test -z "$(git status --porcelain)" || { echo "::error::Generated files are stale. Run pnpm --filter @tohe/routes build and pnpm --filter @tohe/hub generate:api, then commit."; git diff --stat; exit 1; }
      - name: Upload conformance screenshots
        if: always() && env.ALL == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: conformance
          path: games/*/test-results/conformance/
          if-no-files-found: ignore

  chart:
    name: Helm chart (lint, guards, install on kind)
    needs: changes
    if: needs.changes.outputs.scope == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Helm 3, as ArgoCD renders charts with it (ADR 0021).
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.3
      - name: Lint, render every profile, check every guard
        run: deploy/helm/tohe/ci/check.sh
      - name: Build the images
        run: |
          docker build -f deploy/docker/api.Dockerfile -t tohe-api:ci .
          for target in hub games site; do
            docker build -f deploy/docker/web.Dockerfile --target "$target" -t "tohe-$target:ci" .
          done
      - uses: helm/kind-action@v1
        with:
          cluster_name: tohe
      - name: Load the images into kind
        run: kind load docker-image tohe-api:ci tohe-hub:ci tohe-games:ci tohe-site:ci --name tohe
      - name: Install from scratch (builtin PostgreSQL, the chart's own Secret)
        run: |
          helm install tohe deploy/helm/tohe \
            -f deploy/helm/tohe/ci/standalone.yaml -f deploy/helm/tohe/ci/kind/images.yaml \
            --wait --timeout 10m
      - name: helm test
        run: helm test tohe --logs
      - name: Upgrade in place
        run: |
          helm upgrade tohe deploy/helm/tohe \
            -f deploy/helm/tohe/ci/standalone.yaml -f deploy/helm/tohe/ci/kind/images.yaml \
            --set api.config.Rooms__GraceSeconds=45 --wait --timeout 10m
          helm test tohe --logs
      - name: Cluster state
        if: failure()
        run: |
          kubectl get pods,pvc,events -o wide
          kubectl describe pods
          for component in api hub games site postgres; do
            kubectl logs -l app.kubernetes.io/component=$component --tail=80 --all-containers || true
          done

  stack:
    name: Docker stack + e2e smoke and rooms
    needs: changes
    if: needs.changes.outputs.scope == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The hub then serves /.well-known/security.txt, and the routes check reads it (ADR 0042).
      TOHE_SECURITY_CONTACT: security@example.test
      # The hub image's second site, the console's own host, published by compose.yaml (ADR 0042).
      HUB_URL: http://localhost:4720
      CONSOLE_URL: http://localhost:4721
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build images
        run: docker compose build
      - name: Start stack
        run: docker compose up -d --wait postgres && docker compose up -d
      - name: Wait for the API
        run: |
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:4720/api/health && exit 0
            sleep 2
          done
          exit 1
      - name: The hub and the console serve the map of their paths (ADR 0042)
        run: pnpm --filter @tohe/e2e routes
      - run: pnpm --filter @tohe/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @tohe/e2e smoke
        env:
          # The smoke test claims the new deployment with the setup token the API logs; the API container's command is
          # the way when it is owned already (ADR 0027).
          ADMIN_LOGS_COMMAND: docker compose --project-directory ${{ github.workspace }} logs api
          ADMIN_GRANT_COMMAND: docker compose --project-directory ${{ github.workspace }} exec -T api dotnet Tohe.Api.dll admin grant
      - name: Online rooms, three phones (ADR 0016, 0017)
        run: pnpm --filter @tohe/e2e rooms
      - name: A newcomer's first touches (E-03)
        run: pnpm --filter @tohe/e2e journey
      - name: Site is served
        run: curl -fsS http://localhost:4710/docs/ | grep -q "Tò He"
      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color
      - name: Upload e2e screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e
          path: tools/e2e/test-results/
          if-no-files-found: ignore

  # What passed every check on main becomes the release (ADR 0021): four images tagged with the commit, and the chart
  # whose appVersion is that tag. UAT deploys these images; production pins a chart version and a tag.
  publish:
    name: Publish images and chart to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, chart, stack]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGES: ghcr.io/${{ github.repository }}
      CHARTS: oci://ghcr.io/${{ github.repository_owner }}/charts
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.3
      - name: Sign in to ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          echo "$TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
      - name: Build and push the images (sha-<commit>)
        run: |
          tag="sha-$GITHUB_SHA"
          labels=(--label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY"
            --label "org.opencontainers.image.revision=$GITHUB_SHA")
          docker build --pull -f deploy/docker/api.Dockerfile "${labels[@]}" -t "$IMAGES/api:$tag" .
          for target in hub games site; do
            docker build --pull -f deploy/docker/web.Dockerfile --target "$target" "${labels[@]}" -t "$IMAGES/$target:$tag" .
          done
          for component in api hub games site; do
            docker push --quiet "$IMAGES/$component:$tag"
          done
      - name: Package and push the chart (<version>-g<short sha>)
        run: |
          version="$(sed -n 's/^version: *//p' deploy/helm/tohe/Chart.yaml)-g${GITHUB_SHA::7}"
          helm package deploy/helm/tohe --version "$version" --app-version "sha-$GITHUB_SHA" --destination dist
          helm push "dist/tohe-$version.tgz" "$CHARTS"
          {
            echo "### Published $GITHUB_SHA"
            echo
            echo "- Images: \`$IMAGES/{api,hub,games,site}:sha-$GITHUB_SHA\`"
            echo "- Chart: \`helm install tohe $CHARTS/tohe --version $version\`"
          } >>"$GITHUB_STEP_SUMMARY"
