name: CI

on:
  pull_request:
  push:
    branches: [main]

# A pull request: a new push cancels the run of the one before. main: every merge commit gets a run of its own, side by
# side with the others — its images and chart are tagged with its commit, so no run waits for another or replaces it, and
# every commit on main can be released.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  ASTRO_TELEMETRY_DISABLED: 1
  # main runs every task without reading a cache, and only writes it: what gets published has passed every check from
  # scratch. A pull request replays a task whose inputs did not change from the cache main saved.
  TURBO_CACHE: ${{ github.event_name == 'push' && 'local:w' || 'local:rw' }}
  # The images of the run: built once by the images job (deploy/docker/docker-bake.hcl), tested by the chart and e2e
  # jobs, and on main pushed as they are.
  IMAGES: ghcr.io/${{ github.repository }}
  TOHE_IMAGE_TAG: sha-${{ github.sha }}

# A pull request runs what it touches (docs/guides/environments.md#continuous-integration): nothing for notes only, the
# docs app and its link check for docs, every job otherwise. A push to main runs every job, every task without reading a
# cache, before anything is published. The jobs run side by side — the runners of a public repository cost nothing — with
# one game's conformance and one e2e suite per runner. "CI passed" waits for every job: it is the one check to require,
# and the one publish waits for. A new job goes into its needs.
jobs:
  changes:
    name: What the change touches
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      games: ${{ steps.scope.outputs.games }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          outputs="$(scripts/ci-scope.sh)"
          echo "$outputs" >> "$GITHUB_OUTPUT"
          echo "$outputs"

  # pnpm verify, the Definition of Done, is this job, the api job and the conformance jobs together.
  verify:
    name: Verify (Biome, typecheck, test, build)
    needs: changes
    if: needs.changes.outputs.scope != 'notes'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          turbo-cache: verify
      - name: Docs only — Biome, and the docs app with its link check
        if: needs.changes.outputs.scope == 'docs'
        run: pnpm exec biome check . && pnpm exec turbo run build --filter=@tohe/docs
      - name: Biome, then typecheck, test and build every package but the API's
        if: needs.changes.outputs.scope == 'all'
        run: pnpm exec biome check . && pnpm exec turbo run typecheck test build --filter='!@tohe/api'
      - if: github.event_name == 'push'
        uses: ./.github/actions/save-caches
        with:
          turbo-cache: verify
          pnpm-store: true

  api:
    name: API (build, test on PostgreSQL, generated files)
    needs: changes
    if: needs.changes.outputs.scope == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          dotnet: true
          turbo-cache: api
      # The tests run on PostgreSQL in Testcontainers, on the runner's Docker.
      - name: Build and test the API
        run: pnpm exec turbo run build test --filter=@tohe/api
      - name: Generated files are up to date
        # The API's types, and what the map in @tohe/routes generates (ADR 0042), regenerated outside Turborepo's cache.
        run: |
          pnpm --filter @tohe/hub generate:api
          pnpm --filter @tohe/routes build
          git status --porcelain
          test -z "$(git status --porcelain)" || { echo "::error::Generated files are stale. Run pnpm --filter @tohe/routes build and pnpm --filter @tohe/hub generate:api, then commit."; git diff --stat; exit 1; }
      - if: github.event_name == 'push'
        uses: ./.github/actions/save-caches
        with:
          turbo-cache: api

  # One game per runner, for every game the changes job found: the kit times its checks, and a browser of another game
  # on the same small runner made them miss.
  conformance:
    name: Conformance (${{ matrix.game }})
    needs: changes
    if: needs.changes.outputs.scope == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJSON(needs.changes.outputs.games) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          turbo-cache: conformance-${{ matrix.game }}
      - name: Install Chromium for the conformance kit
        run: pnpm --filter @tohe/conformance exec playwright install --with-deps chromium
      - name: The conformance kit
        run: pnpm exec turbo run conformance --filter=./games/${{ matrix.game }}
      - name: Upload conformance screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conformance-${{ matrix.game }}
          path: games/${{ matrix.game }}/test-results/conformance/
          if-no-files-found: ignore
      - if: github.event_name == 'push'
        uses: ./.github/actions/save-caches
        with:
          turbo-cache: conformance-${{ matrix.game }}

  # A new version of the hub never interrupts an open page (ADR 0046, PB-17): two builds of the hub, served by the test
  # itself, no stack; a page on the first must survive the second with no reload. About 20 seconds on a laptop.
  updates:
    name: Updates (two builds of the hub)
    needs: changes
    if: needs.changes.outputs.scope == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Install Chromium
        run: pnpm --filter @tohe/hub exec playwright install --with-deps chromium
      - name: A page on build A survives build B's deploy, with no reload; the next cold start runs B
        run: pnpm --filter @tohe/hub updates

  # What passed every check on main becomes the release (ADR 0021): the images are built here once, in parallel, and every
  # later job uses these very images — the chart on kind, the e2e suites, and publish, which pushes them as they are.
  images:
    name: Images (built once for the run)
    needs: changes
    if: needs.changes.outputs.scope == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build the images (deploy/docker/docker-bake.hcl)
        env:
          TAG: ${{ env.TOHE_IMAGE_TAG }}
          REVISION: ${{ github.sha }}
        run: |
          set -o pipefail
          docker buildx bake -f deploy/docker/docker-bake.hcl --print | jq -r '.target[].tags[]' | sort >images.txt
          docker buildx bake -f deploy/docker/docker-bake.hcl --pull
          docker save --output images.tar $(cat images.txt)
          ls -l images.tar && cat images.txt
      - uses: actions/upload-artifact@v7
        with:
          name: images
          path: |
            images.tar
            images.txt
          if-no-files-found: error
          retention-days: 1

  chart:
    name: Helm chart (lint, guards, install on kind)
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Helm 3, as ArgoCD renders charts with it (ADR 0021).
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.3
      - name: Lint, render every profile, check every guard
        run: deploy/helm/tohe/ci/check.sh
      - uses: actions/download-artifact@v8
        with:
          name: images
      - uses: helm/kind-action@v1
        with:
          cluster_name: tohe
      - name: Load the run's images into kind
        run: |
          docker load --input images.tar
          kind load docker-image $(cat images.txt) --name tohe
      - name: Install from scratch (builtin PostgreSQL, the chart's own Secret)
        run: |
          helm install tohe deploy/helm/tohe \
            -f deploy/helm/tohe/ci/standalone.yaml -f deploy/helm/tohe/ci/kind/images.yaml \
            --set global.image.tag="$TOHE_IMAGE_TAG" --wait --timeout 10m
      - name: helm test
        run: helm test tohe --logs
      - name: Upgrade in place
        run: |
          helm upgrade tohe deploy/helm/tohe \
            -f deploy/helm/tohe/ci/standalone.yaml -f deploy/helm/tohe/ci/kind/images.yaml \
            --set global.image.tag="$TOHE_IMAGE_TAG" --set api.config.Rooms__GraceSeconds=45 --wait --timeout 10m
          helm test tohe --logs
      - name: Cluster state
        if: failure()
        run: |
          kubectl get pods,pvc,events -o wide
          kubectl describe pods
          for component in api hub games docs postgres; do
            kubectl logs -l app.kubernetes.io/component=$component --tail=80 --all-containers || true
          done

  # Each suite on a compose stack of its own, from the run's images, as Mode C runs the published ones
  # (compose.image.yaml): a suite neither waits for another nor shares its sign-in rate limit or its CPU.
  e2e:
    name: E2E (${{ matrix.suite }})
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The suites in tools/e2e: a new suite is a new entry.
        suite: [smoke, rooms, journey, entries]
    env:
      COMPOSE_FILE: ${{ github.workspace }}/compose.yaml:${{ github.workspace }}/compose.image.yaml
      TOHE_VERSION: ${{ github.sha }}
      # The hub then serves /.well-known/security.txt, and the routes check reads it (ADR 0042).
      TOHE_SECURITY_CONTACT: security@example.test
      # The hub image's second site, the console's own host, published by compose.yaml (ADR 0042).
      HUB_URL: http://localhost:4720
      CONSOLE_URL: http://localhost:4721
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: images
      - name: Start the stack on the run's images
        run: |
          docker load --input images.tar
          docker compose up -d --wait postgres
          docker compose up -d --no-build
      - name: Wait for the API
        run: |
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:4720/api/health && exit 0
            sleep 2
          done
          exit 1
      - name: The hub and the console serve the map of their paths (ADR 0042), the docs the root of their host
        run: |
          pnpm --filter @tohe/e2e routes
          curl -fsS http://localhost:4710/ | grep -q "Tò He"
      - run: pnpm --filter @tohe/e2e exec playwright install --with-deps chromium
      - name: The ${{ matrix.suite }} suite
        run: pnpm --filter @tohe/e2e "$SUITE"
        env:
          SUITE: ${{ matrix.suite }}
          # The smoke test claims the new deployment with the setup token the API logs; the API container's command is
          # the way when it is owned already (ADR 0027).
          ADMIN_LOGS_COMMAND: docker compose --project-directory ${{ github.workspace }} logs api
          ADMIN_GRANT_COMMAND: docker compose --project-directory ${{ github.workspace }} exec -T api dotnet Tohe.Api.dll admin grant
      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color
      - name: Upload e2e screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.suite }}
          path: tools/e2e/test-results/
          if-no-files-found: ignore

  passed:
    name: CI passed
    needs: [changes, verify, api, conformance, updates, images, chart, e2e]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed, or was not needed for this change
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' <<<"$NEEDS"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS" >/dev/null

  # What passed every check on main becomes the release (ADR 0021): the run's four images, tagged with the commit, and the
  # chart whose appVersion is that tag. UAT deploys these images; production pins a chart version and a tag.
  publish:
    name: Publish images and chart to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: passed
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      CHARTS: oci://ghcr.io/${{ github.repository_owner }}/charts
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.3
      - uses: actions/download-artifact@v8
        with:
          name: images
      - name: Sign in to ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          echo "$TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
      - name: Push the images the run tested (sha-<commit>)
        run: |
          docker load --input images.tar
          while read -r image; do docker push --quiet "$image"; done <images.txt
      - name: Package and push the chart (<version>-g<short sha>)
        run: |
          version="$(sed -n 's/^version: *//p' deploy/helm/tohe/Chart.yaml)-g${GITHUB_SHA::7}"
          helm package deploy/helm/tohe --version "$version" --app-version "$TOHE_IMAGE_TAG" --destination dist
          helm push "dist/tohe-$version.tgz" "$CHARTS"
          {
            echo "### Published $GITHUB_SHA"
            echo
            sed 's/.*/- Image: `&`/' images.txt
            echo "- Chart: \`helm install tohe $CHARTS/tohe --version $version\`"
          } >>"$GITHUB_STEP_SUMMARY"
