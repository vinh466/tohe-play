name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Verify (lint, typecheck, test, build, conformance)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: pnpm install --frozen-lockfile
      - run: dotnet tool restore
      - name: Install Chromium for the conformance kit
        run: pnpm --filter @tohe/conformance exec playwright install --with-deps chromium
      - run: pnpm verify
      - name: Generated files are up to date
        run: |
          pnpm --filter @tohe/hub generate:api
          git status --porcelain
          test -z "$(git status --porcelain)" || { echo "::error::Generated files are stale. Run pnpm build and pnpm --filter @tohe/hub generate:api, then commit."; git diff --stat; exit 1; }
      - name: Upload conformance screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conformance
          path: games/*/test-results/conformance/
          if-no-files-found: ignore

  stack:
    name: Docker stack + e2e smoke and rooms
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build images
        run: docker compose build
      - name: Start stack
        run: docker compose up -d --wait postgres && docker compose up -d
      - name: Wait for the API
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:4720/api/health && exit 0
            sleep 2
          done
          exit 1
      - run: pnpm --filter @tohe/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @tohe/e2e smoke
      - name: Online rooms, two phones (ADR 0016)
        run: pnpm --filter @tohe/e2e rooms
      - name: Site is served
        run: curl -fsS http://localhost:4710/docs/ | grep -q "Tò He"
      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color
      - name: Upload e2e screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e
          path: tools/e2e/test-results/
          if-no-files-found: ignore
