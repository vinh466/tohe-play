# Tò He — UAT on the homelab (this machine), reachable by the family's devices over WireGuard/LAN.
# Do not run by hand: deploy with deploy/uat/deploy.sh, which runs the images CI published for an exact commit
# (ADR 0021), backs up the database first and supplies the secrets file. See docs/guides/uat.md.
#
# Hub (public pages + app) http://${TOHE_UAT_HOST}:4820   ·   Console :4821   ·   Studio :4822   ·   Docs http://${TOHE_UAT_HOST}:4810   ·   Games origin :4830
# The API and PostgreSQL are not published; the hub proxies /api, the console its own routes (/api/admin), the Studio
# its own (/api/studio).
name: tohe-uat

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: tohe
      POSTGRES_USER: tohe
      POSTGRES_PASSWORD: ${TOHE_UAT_DB_PASSWORD:?set by deploy/uat/deploy.sh}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tohe -d tohe"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    <<: *restart
    image: ghcr.io/vinh466/tohe-play/api:${TOHE_IMAGE_TAG:?set by deploy/uat/deploy.sh}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      App__Version: ${TOHE_VERSION:-unknown}
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=tohe;Username=tohe;Password=${TOHE_UAT_DB_PASSWORD};GSS Encryption Mode=Disable
      Database__MigrateOnStartup: "true"
      App__PublicUrl: http://${TOHE_UAT_HOST:-10.100.0.2}:4820
      # The console's own host: the hub image's second site, published on 4821 (ADR 0042).
      App__ConsoleUrl: http://${TOHE_UAT_HOST:-10.100.0.2}:4821
      # The Asset Studio's own host: the hub image's third site, published on 4822 (ADR 0051).
      App__StudioUrl: http://${TOHE_UAT_HOST:-10.100.0.2}:4822
      Games__PublicOrigin: http://${TOHE_UAT_HOST:-10.100.0.2}:4830
      Games__CatalogUrl: http://games:8080/catalog.json
      Registry__SyncInterval: "00:01:00"
      Telemetry__OperatorToken: ${TOHE_UAT_TELEMETRY_TOKEN:?set by deploy/uat/deploy.sh}
      # Off until the relay's settings are in uat.env (docs/guides/uat.md, ADR 0022).
      Email__Mode: ${TOHE_UAT_EMAIL_MODE:-Disabled}
      Email__From: ${TOHE_UAT_EMAIL_FROM:-}
      Email__Smtp__Host: ${TOHE_UAT_SMTP_HOST:-}
      Email__Smtp__Port: ${TOHE_UAT_SMTP_PORT:-587}
      Email__Smtp__Username: ${TOHE_UAT_SMTP_USERNAME:-}
      Email__Smtp__Password: ${TOHE_UAT_SMTP_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy

  hub:
    <<: *restart
    image: ghcr.io/vinh466/tohe-play/hub:${TOHE_IMAGE_TAG:?set by deploy/uat/deploy.sh}
    environment:
      API_UPSTREAM: api:8080
      GAMES_ORIGIN: http://${TOHE_UAT_HOST:-10.100.0.2}:4830
      # The public page's canonical links, /sitemap.xml and robots.txt name the hub's own URL; its links to the
      # developer docs name the docs host's (ADR 0042).
      TOHE_HUB_URL: http://${TOHE_UAT_HOST:-10.100.0.2}:4820
      TOHE_DOCS_URL: http://${TOHE_UAT_HOST:-10.100.0.2}:4810
      # /.well-known/security.txt names this address; unset in uat.env, that path answers 404.
      TOHE_SECURITY_CONTACT: ${TOHE_UAT_SECURITY_CONTACT:-}
    depends_on:
      - api
    ports:
      - "4820:8080"
      # The console (ADR 0042): the same image's second site, at the root of its own host.
      - "4821:8081"
      # The Asset Studio (ADR 0051): the third site, at the root of its own host. No storage on UAT yet, so no
      # STUDIO_STORAGE_ORIGIN: its pictures would come from the API alone.
      - "4822:8082"

  games:
    <<: *restart
    image: ghcr.io/vinh466/tohe-play/games:${TOHE_IMAGE_TAG:?set by deploy/uat/deploy.sh}
    environment:
      # The hub, and the console, which frames a game to watch a ranked run (ADR 0032).
      HUB_ORIGINS: http://${TOHE_UAT_HOST:-10.100.0.2}:4820 http://${TOHE_UAT_HOST:-10.100.0.2}:4821
      PUBLIC_HUB_URL: http://${TOHE_UAT_HOST:-10.100.0.2}:4820
    ports:
      - "4830:8080"

  docs:
    <<: *restart
    image: ghcr.io/vinh466/tohe-play/docs:${TOHE_IMAGE_TAG:?set by deploy/uat/deploy.sh}
    environment:
      PUBLIC_HUB_URL: http://${TOHE_UAT_HOST:-10.100.0.2}:4820
      TOHE_DOCS_URL: http://${TOHE_UAT_HOST:-10.100.0.2}:4810
    ports:
      - "4810:8080"

volumes:
  postgres-data:
