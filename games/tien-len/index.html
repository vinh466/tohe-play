<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Tiến Lên</title>
  </head>
  <body>
    <div id="app">
      <header id="hud">
        <div id="menu-slot"></div>
        <div class="stat">
          <span class="stat-label" id="score-label"></span>
          <span class="stat-value" id="score">0</span>
        </div>
        <span class="hand-no" id="hand-no"></span>
        <button type="button" class="sort" id="sort"></button>
      </header>
      <main id="stage"></main>
      <footer id="controls">
        <p class="status" id="status" role="status" aria-live="polite"></p>
        <div class="buttons">
          <button type="button" class="action secondary" id="pass" disabled></button>
          <button type="button" class="action secondary" id="hint" disabled></button>
          <button type="button" class="action primary" id="play" disabled></button>
        </div>
      </footer>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
