<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Ghép Khối</title>
  </head>
  <body>
    <div id="app">
      <header id="hud">
        <div class="stat">
          <span class="stat-label" id="score-label"></span>
          <span class="stat-value" id="score">0</span>
        </div>
        <div class="next" id="next-box">
          <span class="stat-label" id="next-label"></span>
          <span class="mini-block" id="next-block"></span>
        </div>
        <div class="stat stat-best" id="best-box">
          <span class="stat-label"><span class="crown" aria-hidden="true">👑</span> <span id="best-label"></span></span>
          <span class="stat-value" id="best">0</span>
        </div>
      </header>
      <main id="stage"></main>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
