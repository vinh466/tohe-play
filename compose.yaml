# Tò He — local stack. Three ways to use it (see docs/guides/local-development.md):
#   docker compose up -d postgres     -> database only, then `pnpm dev` for hot reload (add seaweedfs for the Studio)
#   docker compose up --build -d      -> everything in containers, production-like images
#   pnpm stack:image <tag|commit>     -> the images CI published for a commit (compose.image.yaml)
# Set TOHE_PUBLIC_HOST to this machine's LAN IP to try it from a phone on the same network.
name: tohe

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: tohe
      POSTGRES_USER: tohe
      POSTGRES_PASSWORD: tohe-dev-only
    ports:
      - "127.0.0.1:4750:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tohe -d tohe"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=tohe;Username=tohe;Password=tohe-dev-only;GSS Encryption Mode=Disable
      Database__MigrateOnStartup: "true"
      App__PublicUrl: http://${TOHE_PUBLIC_HOST:-localhost}:4720
      # The console's own host: the hub image's second site, published on 4721 (ADR 0042).
      App__ConsoleUrl: http://${TOHE_PUBLIC_HOST:-localhost}:4721
      # The Asset Studio's own host: the hub image's third site, published on 4722 (ADR 0051).
      App__StudioUrl: http://${TOHE_PUBLIC_HOST:-localhost}:4722
      Games__PublicOrigin: http://${TOHE_PUBLIC_HOST:-localhost}:4730
      Games__CatalogUrl: http://games:8080/catalog.json
      Registry__SyncInterval: "00:00:20"
      # Mail goes to Mailpit: read it at http://localhost:4760 (ADR 0022).
      Email__Mode: Smtp
      Email__From: Tò He <no-reply@tohe.localhost>
      Email__Smtp__Host: mailpit
      Email__Smtp__Port: "1025"
      Email__Smtp__Security: None
      # Development token for the telemetry report (local containers only, like the database password).
      Telemetry__OperatorToken: tohe-dev-only
      # `pnpm seed` may fill this database with demo accounts; UAT and production never set this.
      Dev__SeedAllowed: "true"
      # Scalar at http://localhost:4720/api/docs; off by default outside Development (ADR 0042).
      Api__Reference__Enabled: "true"
      # The Studio's object storage: SeaweedFS below, with its development-only key (ADR 0051).
      Studio__Storage__ServiceUrl: http://seaweedfs:8333
      Studio__Storage__Bucket: tohe-studio
      Studio__Storage__AccessKey: tohe
      Studio__Storage__SecretKey: tohe-dev-only
      Studio__Storage__PublicBaseUrl: http://${TOHE_PUBLIC_HOST:-localhost}:4770/tohe-studio
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
      seaweedfs:
        condition: service_started
    ports:
      - "4740:8080"

  hub:
    build:
      context: .
      dockerfile: deploy/docker/web.Dockerfile
      target: hub
    environment:
      API_UPSTREAM: api:8080
      GAMES_ORIGIN: http://${TOHE_PUBLIC_HOST:-localhost}:4730
      # The public page's canonical links, /sitemap.xml and robots.txt name the hub's own URL; its links to the
      # developer docs name the docs host's (ADR 0042).
      TOHE_HUB_URL: http://${TOHE_PUBLIC_HOST:-localhost}:4720
      TOHE_DOCS_URL: http://${TOHE_PUBLIC_HOST:-localhost}:4710
      # Set it to try /.well-known/security.txt; unset, that path answers 404.
      TOHE_SECURITY_CONTACT: ${TOHE_SECURITY_CONTACT:-}
      # The Studio's pictures may come from the public library, SeaweedFS below (ADR 0051).
      STUDIO_STORAGE_ORIGIN: http://${TOHE_PUBLIC_HOST:-localhost}:4770
    depends_on:
      - api
    ports:
      - "4720:8080"
      # The console (ADR 0042): the same image's second site, at the root of its own host.
      - "4721:8081"
      # The Asset Studio (ADR 0051): the third site, at the root of its own host.
      - "4722:8082"

  games:
    build:
      context: .
      dockerfile: deploy/docker/web.Dockerfile
      target: games
      # A game with asset packs builds them from the Studio's registry (ADR 0053): https://assets.toheplay.io.vn holds
      # every approved pack. Unset, such a game's build fails naming the variable.
      args:
        TOHE_ASSETS_REGISTRY: ${TOHE_ASSETS_REGISTRY:-}
    environment:
      # The hub, and the console, which frames a game to watch a ranked run (ADR 0032).
      HUB_ORIGINS: http://${TOHE_PUBLIC_HOST:-localhost}:4720 http://${TOHE_PUBLIC_HOST:-localhost}:4721
      PUBLIC_HUB_URL: http://${TOHE_PUBLIC_HOST:-localhost}:4720
    ports:
      - "4730:8080"

  # The developer docs, at the root of their own host (ADR 0042).
  docs:
    build:
      context: .
      dockerfile: deploy/docker/web.Dockerfile
      target: docs
    environment:
      PUBLIC_HUB_URL: http://${TOHE_PUBLIC_HOST:-localhost}:4720
      TOHE_DOCS_URL: http://${TOHE_PUBLIC_HOST:-localhost}:4710
    ports:
      - "4710:8080"

  # Catches every email the API sends, locally: web UI on 4760, SMTP on 4761 for `pnpm dev`.
  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - "127.0.0.1:4760:8025"
      - "127.0.0.1:4761:1025"

  # The Asset Studio's object storage (ADR 0051): SeaweedFS (Apache-2.0) with its S3 gateway on 4770 and a bucket
  # `tohe-studio`. Anyone may read blobs/ and packs/ — the registry builds read, TOHE_ASSETS_REGISTRY=
  # http://localhost:4770/tohe-studio — and everything else takes the development-only key.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command: ["mini", "-dir=/data", "-bucket=tohe-studio", "-admin.ui=false", "-s3.config=/etc/seaweedfs/s3.json"]
    configs:
      - source: seaweedfs-s3
        target: /etc/seaweedfs/s3.json
    ports:
      - "127.0.0.1:4770:8333"
    volumes:
      - seaweedfs-data:/data

configs:
  seaweedfs-s3:
    content: |
      {
        "identities": [
          {
            "name": "tohe",
            "credentials": [{ "accessKey": "tohe", "secretKey": "tohe-dev-only" }],
            "actions": ["Admin", "Read", "Write", "List", "Tagging"]
          },
          { "name": "anonymous", "actions": ["Read:tohe-studio/blobs/*", "Read:tohe-studio/packs/*"] }
        ]
      }

volumes:
  postgres-data:
  seaweedfs-data:
